# Render Blueprint: the API only (no cron jobs, no Chrome) on the free plan.
# Background jobs run in .github/workflows/background-jobs.yml instead.
services:
  - type: web
    name: job-map-india-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    envVars:
      - key: WEB_ONLY
        value: "true"
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: NODE_VERSION
        value: "22"
      # Query embeddings via Cloudflare Workers AI: the local ONNX model needs
      # more than the free plan's 512 MB. Ingestion (GitHub Actions) stays local.
      - key: EMBED_PROVIDER
        value: cloudflare
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
